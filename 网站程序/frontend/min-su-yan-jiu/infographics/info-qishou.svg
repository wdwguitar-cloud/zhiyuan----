<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8DCC8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#5A3A1F" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="650" fill="url(#bgGrad4)"/>

  <!-- 标题 -->
  <text x="450" y="50" text-anchor="middle" font-family="STKaiti, KaiTi, serif" font-size="28" fill="#2A190D" font-weight="bold">古代人真的短命吗？</text>
  <text x="450" y="80" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif" font-size="14" fill="#7A6B5D">"平均寿命30岁"被婴儿死亡率严重拉低——寿命分布是两极分化的</text>

  <!-- 图表区域 -->
  <g transform="translate(80, 110)">
    <!-- Y轴 -->
    <line x1="0" y1="0" x2="0" y2="380" stroke="#5A3A1F" stroke-width="2"/>
    <!-- X轴 -->
    <line x1="0" y1="380" x2="740" y2="380" stroke="#5A3A1F" stroke-width="2"/>

    <!-- Y轴标签 -->
    <text x="-10" y="10" text-anchor="end" font-family="Noto Serif SC, SimSun, serif" font-size="11" fill="#5A3A1F">50%</text>
    <text x="-10" y="100" text-anchor="end" font-family="Noto Serif SC, SimSun, serif" font-size="11" fill="#5A3A1F">40%</text>
    <text x="-10" y="190" text-anchor="end" font-family="Noto Serif SC, SimSun, serif" font-size="11" fill="#5A3A1F">30%</text>
    <text x="-10" y="280" text-anchor="end" font-family="Noto Serif SC, SimSun, serif" font-size="11" fill="#5A3A1F">20%</text>
    <text x="-10" y="370" text-anchor="end" font-family="Noto Serif SC, SimSun, serif" font-size="11" fill="#5A3A1F">10%</text>
    <text x="-10" y="385" text-anchor="end" font-family="Noto Serif SC, SimSun, serif" font-size="11" fill="#5A3A1F">0%</text>

    <!-- X轴标签 -->
    <text x="60" y="405" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif" font-size="11" fill="#5A3A1F">0-5岁</text>
    <text x="180" y="405" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif" font-size="11" fill="#5A3A1F">6-20岁</text>
    <text x="300" y="405" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif" font-size="11" fill="#5A3A1F">21-40岁</text>
    <text x="420" y="405" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif" font-size="11" fill="#5A3A1F">41-60岁</text>
    <text x="540" y="405" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif" font-size="11" fill="#5A3A1F">61-80岁</text>
    <text x="660" y="405" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif" font-size="11" fill="#5A3A1F">80岁+</text>

    <!-- 古代寿命分布（红色系） -->
    <!-- 0-5岁：40% -->
    <rect x="30" y="20" width="60" height="360" fill="#8B3A3A" opacity="0.8" rx="3"/>
    <text x="60" y="15" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif" font-size="11" fill="#8B3A3A" font-weight="bold">40%</text>

    <!-- 6-20岁：10% -->
    <rect x="150" y="290" width="60" height="90" fill="#8B3A3A" opacity="0.6" rx="3"/>
    <text x="180" y="285" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif" font-size="11" fill="#8B3A3A">10%</text>

    <!-- 21-40岁：15% -->
    <rect x="270" y="245" width="60" height="135" fill="#8B3A3A" opacity="0.6" rx="3"/>
    <text x="300" y="240" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif" font-size="11" fill="#8B3A3A">15%</text>

    <!-- 41-60岁：20% -->
    <rect x="390" y="200" width="60" height="180" fill="#8B3A3A" opacity="0.6" rx="3"/>
    <text x="420" y="195" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif" font-size="11" fill="#8B3A3A">20%</text>

    <!-- 61-80岁：12% -->
    <rect x="510" y="272" width="60" height="108" fill="#8B3A3A" opacity="0.6" rx="3"/>
    <text x="540" y="267" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif" font-size="11" fill="#8B3A3A">12%</text>

    <!-- 80岁+：3% -->
    <rect x="630" y="353" width="60" height="27" fill="#8B3A3A" opacity="0.8" rx="3"/>
    <text x="660" y="348" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif" font-size="11" fill="#8B3A3A" font-weight="bold">3%</text>

    <!-- 现代寿命分布（绿色系，叠加显示） -->
    <!-- 0-5岁：1% -->
    <rect x="95" y="371" width="30" height="9" fill="#5A7A3A" opacity="0.8" rx="2"/>
    <text x="110" y="366" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif" font-size="9" fill="#5A7A3A">1%</text>

    <!-- 6-20岁：18% -->
    <rect x="215" y="218" width="30" height="162" fill="#5A7A3A" opacity="0.6" rx="2"/>

    <!-- 21-40岁：25% -->
    <rect x="335" y="155" width="30" height="225" fill="#5A7A3A" opacity="0.6" rx="2"/>

    <!-- 41-60岁：28% -->
    <rect x="455" y="128" width="30" height="252" fill="#5A7A3A" opacity="0.6" rx="2"/>

    <!-- 61-80岁：22% -->
    <rect x="575" y="182" width="30" height="198" fill="#5A7A3A" opacity="0.6" rx="2"/>

    <!-- 80岁+：6% -->
    <rect x="695" y="326" width="30" height="54" fill="#5A7A3A" opacity="0.8" rx="2"/>
    <text x="710" y="321" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif" font-size="9" fill="#5A7A3A">6%</text>
  </g>

  <!-- 图例 -->
  <g transform="translate(300, 540)">
    <rect x="0" y="0" width="20" height="15" fill="#8B3A3A" opacity="0.8" rx="2"/>
    <text x="30" y="12" font-family="Noto Serif SC, SimSun, serif" font-size="13" fill="#2A190D">古代寿命分布（估算）</text>
    <rect x="200" y="0" width="20" height="15" fill="#5A7A3A" opacity="0.8" rx="2"/>
    <text x="230" y="12" font-family="Noto Serif SC, SimSun, serif" font-size="13" fill="#2A190D">现代寿命分布（参考）</text>
  </g>

  <!-- 核心结论 -->
  <g filter="url(#shadow4)">
    <rect x="100" y="575" width="700" height="55" rx="8" fill="#2A190D" stroke="#8B4513" stroke-width="2"/>
    <text x="450" y="600" text-anchor="middle" font-family="STKaiti, KaiTi, serif" font-size="15" fill="#E8DCC8" font-weight="bold">核心结论：古代与现代的寿命差异，主要不在"成年人寿命"，而在"儿童存活率"</text>
    <text x="450" y="622" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif" font-size="12" fill="#C4B59E">儋县志记载大量80岁以上长寿者——活过童年的人，有相当比例能活到高龄</text>
  </g>
</svg>
