<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<rect width="1400" height="820" fill="#f4f8fc"/>
<rect x="100" y="70" width="1200" height="680" rx="28" fill="#fff" stroke="#d9e1ec"/>
<text x="150" y="145" font-size="48" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#0b2547" font-weight="900">开工前准备清单样张</text>
<rect x="150" y="180" width="260" height="8" fill="#c89135"/>
<rect x="150" y="250" width="1100" height="58" fill="#fff" stroke="#d9e1ec"/><text x="180" y="288" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#0b2547" font-weight="800">项目资料</text><text x="430" y="288" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#40506a">项目类型、城市、计划日期、负责人</text><rect x="150" y="308" width="1100" height="58" fill="#fff" stroke="#d9e1ec"/><text x="180" y="346" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#0b2547" font-weight="800">现场资料</text><text x="430" y="346" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#40506a">地址、开工位置、施工方进场时间</text><rect x="150" y="366" width="1100" height="58" fill="#fff" stroke="#d9e1ec"/><text x="180" y="404" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#0b2547" font-weight="800">人员资料</text><text x="430" y="404" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#40506a">老板是否到场，谁负责现场统筹</text><rect x="150" y="424" width="1100" height="58" fill="#fff" stroke="#d9e1ec"/><text x="180" y="462" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#0b2547" font-weight="800">物料资料</text><text x="430" y="462" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#40506a">供品、工具、标识、现场布置</text><rect x="150" y="482" width="1100" height="58" fill="#fff" stroke="#d9e1ec"/><text x="180" y="520" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#0b2547" font-weight="800">风险提醒</text><text x="430" y="520" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#40506a">避免临时变更时间、人员不到位、流程混乱</text>
<text x="150" y="700" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#7a8798">注：此为交付样张示意，真实内容需结合客户项目资料单独判断。</text>
</svg>