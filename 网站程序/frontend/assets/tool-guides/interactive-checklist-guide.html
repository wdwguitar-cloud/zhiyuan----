</style></head><body><h1>互动检查表使用说明</h1><div class="lead">用于厂房、门店、办公室、公司乔迁客户开工前自查。</div><h2>一、检查表用途</h2><ul><li>客户勾选后知道自己缺什么。</li><li>合作方可转发给即将开工的客户。</li><li>完成度低时自然引导199初审。</li></ul><h2>二、检查表分类</h2><ul><li>厂房开工检查表。</li><li>门店开业检查表。</li><li>办公室装修检查表。</li><li>公司乔迁检查表。</li></ul><h2>三、转化建议</h2><ul><li>完成度低于60%，建议先补资料。</li><li>完成度60%-85%，建议做资料初审或完整流程。</li><li>完成度高于85%，可进入日期与流程确认。</li></ul></body></html>
