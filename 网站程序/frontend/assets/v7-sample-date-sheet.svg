<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<rect width="1400" height="820" fill="#f4f8fc"/>
<rect x="100" y="70" width="1200" height="680" rx="28" fill="#fff" stroke="#d9e1ec"/>
<text x="150" y="145" font-size="48" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#0b2547" font-weight="900">日期与时辰建议单样张</text>
<rect x="150" y="180" width="260" height="8" fill="#c89135"/>
<rect x="150" y="250" width="1100" height="58" fill="#fff" stroke="#d9e1ec"/><text x="180" y="288" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#0b2547" font-weight="800">项目类型</text><text x="430" y="288" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#40506a">厂房装修开工</text><rect x="150" y="308" width="1100" height="58" fill="#fff" stroke="#d9e1ec"/><text x="180" y="346" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#0b2547" font-weight="800">所在城市</text><text x="430" y="346" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#40506a">佛山</text><rect x="150" y="366" width="1100" height="58" fill="#fff" stroke="#d9e1ec"/><text x="180" y="404" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#0b2547" font-weight="800">推荐日期</text><text x="430" y="404" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#40506a">示例：2026 年某月某日</text><rect x="150" y="424" width="1100" height="58" fill="#fff" stroke="#d9e1ec"/><text x="180" y="462" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#0b2547" font-weight="800">推荐时段</text><text x="430" y="462" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#40506a">示例：上午某时段</text><rect x="150" y="482" width="1100" height="58" fill="#fff" stroke="#d9e1ec"/><text x="180" y="520" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#0b2547" font-weight="800">备选安排</text><text x="430" y="520" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#40506a">若施工方冲突，可调整至备选时段</text><rect x="150" y="540" width="1100" height="58" fill="#fff" stroke="#d9e1ec"/><text x="180" y="578" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#0b2547" font-weight="800">注意事项</text><text x="430" y="578" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#40506a">负责人、施工方、供品与现场动线提前确认</text>
<text x="150" y="700" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#7a8798">注：此为交付样张示意，真实内容需结合客户项目资料单独判断。</text>
