<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<rect width="1400" height="900" fill="#f4f8fc"/>
<text x="80" y="78" font-size="44" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#0b2547" font-weight="900">一次真实项目建议拍这 8 类图</text>
<text x="80" y="118" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#65758a">每类拍 2-3 张，最后挑最干净的一张上网站。</text>
<g font-family="Arial, PingFang SC, Microsoft YaHei">
<rect x="80" y="170" width="270" height="190" rx="20" fill="#fff" stroke="#d9e1ec"/><circle cx="128" cy="220" r="28" fill="#c89135"/><text x="119" y="231" font-size="30" fill="#fff" font-weight="900">1</text><text x="168" y="228" font-size="26" fill="#0b2547" font-weight="900">项目外观</text><text x="108" y="280" font-size="20" fill="#4d5c71">厂房门口 / 店铺门头 / 办公室入口</text><text x="108" y="315" font-size="18" fill="#7a8798">要求：横图优先，画面干净</text><rect x="390" y="170" width="270" height="190" rx="20" fill="#fff" stroke="#d9e1ec"/><circle cx="438" cy="220" r="28" fill="#c89135"/><text x="429" y="231" font-size="30" fill="#fff" font-weight="900">2</text><text x="478" y="228" font-size="26" fill="#0b2547" font-weight="900">现场全景</text><text x="418" y="280" font-size="20" fill="#4d5c71">从门口往内拍，展示空间情况</text><text x="418" y="315" font-size="18" fill="#7a8798">要求：横图优先，画面干净</text><rect x="700" y="170" width="270" height="190" rx="20" fill="#fff" stroke="#d9e1ec"/><circle cx="748" cy="220" r="28" fill="#c89135"/><text x="739" y="231" font-size="30" fill="#fff" font-weight="900">3</text><text x="788" y="228" font-size="26" fill="#0b2547" font-weight="900">开工位置</text><text x="728" y="280" font-size="20" fill="#4d5c71">首动位置 / 主区域 / 门口区域</text><text x="728" y="315" font-size="18" fill="#7a8798">要求：横图优先，画面干净</text><rect x="1010" y="170" width="270" height="190" rx="20" fill="#fff" stroke="#d9e1ec"/><circle cx="1058" cy="220" r="28" fill="#c89135"/><text x="1049" y="231" font-size="30" fill="#fff" font-weight="900">4</text><text x="1098" y="228" font-size="26" fill="#0b2547" font-weight="900">准备物品</text><text x="1038" y="280" font-size="20" fill="#4d5c71">供品、工具、清单，摆放整齐</text><text x="1038" y="315" font-size="18" fill="#7a8798">要求：横图优先，画面干净</text><rect x="80" y="420" width="270" height="190" rx="20" fill="#fff" stroke="#d9e1ec"/><circle cx="128" cy="470" r="28" fill="#c89135"/><text x="119" y="481" font-size="30" fill="#fff" font-weight="900">5</text><text x="168" y="478" font-size="26" fill="#0b2547" font-weight="900">人员到场</text><text x="108" y="530" font-size="20" fill="#4d5c71">只拍背影或局部，避免露脸</text><text x="108" y="565" font-size="18" fill="#7a8798">要求：横图优先，画面干净</text><rect x="390" y="420" width="270" height="190" rx="20" fill="#fff" stroke="#d9e1ec"/><circle cx="438" cy="470" r="28" fill="#c89135"/><text x="429" y="481" font-size="30" fill="#fff" font-weight="900">6</text><text x="478" y="478" font-size="26" fill="#0b2547" font-weight="900">流程执行</text><text x="418" y="530" font-size="20" fill="#4d5c71">开工动作局部，不拍敏感信息</text><text x="418" y="565" font-size="18" fill="#7a8798">要求：横图优先，画面干净</text><rect x="700" y="420" width="270" height="190" rx="20" fill="#fff" stroke="#d9e1ec"/><circle cx="748" cy="470" r="28" fill="#c89135"/><text x="739" y="481" font-size="30" fill="#fff" font-weight="900">7</text><text x="788" y="478" font-size="26" fill="#0b2547" font-weight="900">交付文件</text><text x="728" y="530" font-size="20" fill="#4d5c71">日期单、流程单，客户信息打码</text><text x="728" y="565" font-size="18" fill="#7a8798">要求：横图优先，画面干净</text><rect x="1010" y="420" width="270" height="190" rx="20" fill="#fff" stroke="#d9e1ec"/><circle cx="1058" cy="470" r="28" fill="#c89135"/><text x="1049" y="481" font-size="30" fill="#fff" font-weight="900">8</text><text x="1098" y="478" font-size="26" fill="#0b2547" font-weight="900">结束记录</text><text x="1038" y="530" font-size="20" fill="#4d5c71">现场整理后，干净完整的一张</text><text x="1038" y="565" font-size="18" fill="#7a8798">要求：横图优先，画面干净</text>
</g>
<rect x="80" y="690" width="1240" height="100" rx="20" fill="#fffaf0" stroke="#e6bd72"/>
<text x="120" y="750" font-size="28" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#7f5b1b" font-weight="900">隐私规则：不露脸、不拍车牌、不拍合同、不拍详细地址、不拍客户手机号码。</text>
</svg>